[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  VITE_BACKEND_PRIMARY = "https://billing.jagalikoota.com/api/v1/hotel"
  VITE_BACKEND_SECONDARY = "https://hotelviratbackend.onrender.com/api/v1/hotel"

[context.deploy-preview.environment]
  VITE_BACKEND_PRIMARY = "https://billing.jagalikoota.com/api/v1/hotel"
  VITE_BACKEND_SECONDARY = "https://hotelviratbackend.onrender.com/api/v1/hotel"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"